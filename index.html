function lkd(m){return m.k&&Date.now()>=new Date(m.k).getTime();}
function soonStr(m){if(!m.k)return null;const d=new Date(m.k)-Date.now();if(d<=0||d>48*3600000)return null;const h=Math.floor(d/3600000),mn=Math.floor((d%3600000)/60000);return h>0?`⏰${h}h${mn?mn+'m':''}`:`⏰${mn}min`;}
function calcPts(p,r){if(!p||r===undefined)return null;if(p.s1===r.s1&&p.s2===r.s2)return 3;const pw=p.s1>p.s2?1:(p.s1<p.s2?-1:0),rw=r.s1>r.s2?1:(r.s1<r.s2?-1:0);return pw===rw?1:0;}
function calcScores(){
  const ms=allM(),pl=Object.keys(DB.users);
  return pl.map(p=>{let t=0,e=0,b=0;ms.filter(m=>DB.results[m.id]).forEach(m=>{const v=calcPts((DB.pronos[p]||{})[m.id],DB.results[m.id]);if(v!==null){t+=v;if(v===3)e++;else if(v===1)b++;}});return{p,t,e,b};}).sort((a,b2)=>b2.t-a.t||b2.e-a.e);
}
function phBdg(l){const c=PC[l]||'#6b7280';return`<span style="background:${c}20;color:${c};padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;">${l}</span>`;}
function flag(n,sm){
  const c=CODES[n];const s=sm?'width:22px;height:15px':'width:44px;height:29px';
  if(!c)return`<div style="${s};background:#f3f4f6;border-radius:3px;border:1px solid #e5e7eb;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#9ca3af;">${(n||'').slice(0,2)}</div>`;
  return`<img src="${CDN}${c}.png" style="${s};object-fit:cover;border-radius:${sm?2:4}px;border:1px solid #e5e7eb;" alt="${n}" loading="lazy"/>`;
}
function ptsB(v){return v===3?'<span class="bdg bg">+3</span>':v===1?'<span class="bdg bb">+1</span>':v===0?'<span class="bdg bgr">0</span>':'<span class="bdg bgr">—</span>';}
function showErr(id,msg){const e=document.getElementById(id);if(e){e.textContent=msg;e.style.display='block';}}
function hideErr(id){const e=document.getElementById(id);if(e)e.style.display='none';}
function R(html){document.getElementById('root').innerHTML=html;}

// Formate une date UTC en "Vendredi 11 juin"
function fmtDay(k){
  if(!k)return'';
  const dt=new Date(k);
  const jours=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const mois=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return`${jours[dt.getUTCDay()]} ${dt.getUTCDate()} ${mois[dt.getUTCMonth()]}`;
}
function dayKey(k){if(!k)return'';const d=new Date(k);return`${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`;}

function updateStats(){
  const ms=allM();const mp=DB.pronos[ME]||{};
  const played=ms.filter(m=>DB.results[m.id]);
  const done=Object.keys(mp).length;
  const miss=ms.filter(m=>!lkd(m)&&!DB.results[m.id]&&!mp[m.id]).length;
  if(played.length){
    let tot=0,ex=0,bn=0;played.forEach(m=>{const v=calcPts(mp[m.id],DB.results[m.id]);if(v!==null){tot+=v;if(v===3)ex++;else if(v===1)bn++;}});
    const s1=document.getElementById('st1'),s2=document.getElementById('st2'),s3=document.getElementById('st3');
    if(s1)s1.textContent=tot;if(s2)s2.textContent=ex;if(s3)s3.textContent=bn;
  } else {
    const s1=document.getElementById('st1'),s2=document.getElementById('st2');
    if(s1)s1.textContent=done;if(s2)s2.textContent=miss;
  }
  const wEl=document.getElementById('miss-warn');
  if(wEl){if(miss>0){wEl.style.display='block';wEl.innerHTML=`⚠️ <strong>${miss} match${miss>1?'s':''}</strong> sans pronostic avant le coup d'envoi !`;}else wEl.style.display='none';}
}

function startLive(){
  stopLive();LVC=10;
  LVT=setInterval(async()=>{LVC--;const cd=document.getElementById('lvc');if(cd)cd.textContent=LVC+'s';if(LVC<=0){LVC=10;await dbLoad();const cc=document.getElementById('class-c');if(cc)cc.innerHTML=renderClass();if(cd)cd.textContent='10s';}},1000);
}
function stopLive(){if(LVT){clearInterval(LVT);LVT=null;}}

function trigSave(mid){
  clearTimeout(saveQ[mid]);
  saveQ[mid]=setTimeout(async()=>{
    const m=allM().find(x=>x.id===mid);if(!m||lkd(m))return;
    const i1=document.getElementById('i1_'+mid),i2=document.getElementById('i2_'+mid);if(!i1||!i2)return;
    const s1=Math.max(0,Math.min(20,parseInt(i1.value)||0)),s2=Math.max(0,Math.min(20,parseInt(i2.value)||0));
    i1.value=s1;i2.value=s2;
    if(!DB.pronos[ME])DB.pronos[ME]={};
    DB.pronos[ME][mid]={s1,s2};
    await dbSave('pronos');
    updateStats();
    const sv=document.getElementById('sv_'+mid);if(sv){sv.style.opacity='1';setTimeout(()=>{if(sv)sv.style.opacity='0';},1500);}
    const nb=Object.values(DB.pronos).filter(pv=>pv&&pv[mid]).length;
    const nbEl=document.getElementById('nb_'+mid);if(nbEl)nbEl.textContent=`👥${nb}/${Object.keys(DB.users).length}`;
  },600);
}

function doResume(n){ME=n;showPlayer();}
async function doLogin(){
  const n=document.getElementById('ln').value.trim(),p=document.getElementById('lp').value;
  hideErr('el');if(!n||!p){showErr('el','Remplis tous les champs.');return;}
  await dbLoad();
  if(!DB.users[n]){showErr('el','Nom introuvable — crée un compte !');return;}
  if(DB.users[n].p!==p){showErr('el','Mot de passe incorrect.');return;}
  ME=n;sessSave(n);showPlayer();
}
async function doRegister(){
  const n=document.getElementById('rn').value.trim(),p=document.getElementById('rp').value,p2=document.getElementById('rp2').value;
  hideErr('er');
  if(!n||!p){showErr('er','Remplis tous les champs.');return;}
  if(n.split(' ').filter(w=>w).length<2){showErr('er','Saisis ton nom ET prénom (ex: Dupont Marie)');return;}
  if(p.length<4){showErr('er','Mot de passe trop court (min 4 caractères)');return;}
  if(p!==p2){showErr('er','Les mots de passe ne correspondent pas');return;}
  await dbLoad();
  if(DB.users[n]){showErr('er','Ce nom est déjà utilisé.');return;}
  DB.users[n]={p,ts:Date.now()};
  const ok=await dbSave('users');
  if(!ok){delete DB.users[n];showErr('er','❌ Erreur de connexion à la base. Réessaie dans quelques secondes.');return;}
  ME=n;sessSave(n);showPlayer();
}
function doAdminLogin(){
  const v=document.getElementById('ac').value;hideErr('ea');
  if(v!==ADMIN){showErr('ea','Code incorrect.');return;}
  IS_ADMIN=true;ME=null;showAdmin();
}
function logout(){stopLive();sessClear();ME=null;IS_ADMIN=false;showLogin();}

function setPTab(t){ptab=t;['p','s','c'].forEach((x,i)=>{document.querySelectorAll('.tb')[i].classList.toggle('on',x===t);document.getElementById('tp-'+x).classList.toggle('on',x===t);});}

function buildPronos(){
  const ms=allM();const mp=DB.pronos[ME]||{};
  const pend=ms.filter(m=>!DB.results[m.id]);
  const done2=ms.filter(m=>DB.results[m.id]);
  if(!ms.length)return'<div style="text-align:center;padding:30px;color:var(--text3);">Aucun match disponible</div>';
  let h='';
  if(!pend.length)h+=`<div class="warn" style="background:#dcfce7;border-color:#86efac;color:#15803d;">✅ Tous les matchs ont un résultat !</div>`;

  // Grouper par jour
  let lastDay='';
  pend.forEach(m=>{
    const dk=dayKey(m.k);
    if(dk!==lastDay){
      lastDay=dk;
      h+=`<div class="date-sep">📅 ${fmtDay(m.k)}</div>`;
    }
    const pr=mp[m.id];const lk=lkd(m);const sw=soonStr(m);
    const nb=Object.values(DB.pronos).filter(pv=>pv&&pv[m.id]).length;
    const tot=Object.keys(DB.users).length;
    h+=`<div class="mc">
      <div class="mh">
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">${phBdg(m.g)}<span style="font-size:12px;font-weight:700;color:var(--text);">${m.d}</span>${sw?`<span style="font-size:10px;color:var(--orange);font-weight:700;">${sw}</span>`:''}</div>
        <div style="display:flex;align-items:center;gap:5px;">
          <span id="nb_${m.id}" style="font-size:11px;color:var(--text3);">👥${nb}/${tot}</span>
          ${lk?`<span class="bdg bo">🔒</span>`:`<span id="sv_${m.id}" style="font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .3s;">✓ Sauvé</span>`}
        </div>
      </div>
      <div class="mb">
        <div class="tr">
          <div class="tm">${flag(m.t1)}<div class="tn">${m.t1}</div></div>
          <div class="sb2">
            <input class="si" id="i1_${m.id}" type="number" min="0" max="20" value="${pr?pr.s1:0}" ${lk?'disabled':''} oninput="trigSave('${m.id}')" onchange="trigSave('${m.id}')"/>
            <span class="ss">–</span>
            <input class="si" id="i2_${m.id}" type="number" min="0" max="20" value="${pr?pr.s2:0}" ${lk?'disabled':''} oninput="trigSave('${m.id}')" onchange="trigSave('${m.id}')"/>
          </div>
          <div class="tm">${flag(m.t2)}<div class="tn">${m.t2}</div></div>
        </div>
      </div>
      ${lk?`<div class="lb">🔒 Verrouillé · ${pr?`Ton prono : ${pr.s1}–${pr.s2}`:'Non saisi'}</div>`:''}
    </div>`;
  });

  if(done2.length){
    h+=`<div class="date-sep" style="background:linear-gradient(135deg,#374151,#6b7280);margin-top:16px;">✅ Matchs terminés</div>`;
    done2.forEach(m=>{
      const pr=mp[m.id];const r=DB.results[m.id];const v=calcPts(pr,r);
      const all=Object.entries(DB.pronos).filter(([,pv])=>pv&&pv[m.id]).map(([nm,pv])=>`<div class="chip"><span style="font-size:11px;">${nm.split(' ')[0]}</span><span style="font-weight:700;">${pv[m.id].s1}–${pv[m.id].s2}</span></div>`).join('');
      h+=`<div class="mc"><div class="mh" style="justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:5px;">${flag(m.t1,true)}<span style="font-size:14px;font-weight:700;">${m.t1} ${r.s1}–${r.s2} ${m.t2}</span>${flag(m.t2,true)}<span style="font-size:11px;color:var(--text3);">${m.d}</span></div>
        ${ptsB(v)}</div>
        ${all?`<div style="padding:8px 12px;background:#f9fafb;"><div class="chips">${all}</div></div>`:''}
      </div>`;
    });
  }
  return h;
}

function buildScores(){
  const ms=allM();const mp=DB.pronos[ME]||{};
  const played=ms.filter(m=>DB.results[m.id]);
  if(!played.length)return'<div style="text-align:center;padding:30px;color:var(--text3);">Aucun résultat officiel encore</div>';
  let h='',lastDay='';
  played.forEach(m=>{
    const dk=dayKey(m.k);
    if(dk!==lastDay){lastDay=dk;h+=`<div class="date-sep">📅 ${fmtDay(m.k)}</div>`;}
    const pr=mp[m.id];const r=DB.results[m.id];const v=calcPts(pr,r);
    h+=`<div class="card" style="padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
      <div><div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;">${flag(m.t1,true)}<span style="font-size:13px;font-weight:700;">${m.t1} ${r.s1}–${r.s2} ${m.t2}</span>${flag(m.t2,true)}</div>
      <div style="font-size:12px;color:var(--text2);">${pr?`Mon prono : <strong>${pr.s1}–${pr.s2}</strong>`:'<em style="color:var(--red);">Non saisi</em>'}</div></div>
      ${ptsB(v)}
    </div>`;
  });
  return h;
}

function renderClass(){
  const sc=calcScores();const played=allM().filter(m=>DB.results[m.id]);
  if(!Object.keys(DB.users).length)return'<div style="text-align:center;padding:30px;color:var(--text3);">Aucun participant inscrit</div>';
  if(!played.length)return`<div style="text-align:center;padding:20px;color:var(--text3);"><div style="font-size:30px;margin-bottom:8px;">⏳</div>En attente des résultats...</div>`;
  let h=`<div style="font-size:12px;color:var(--text2);margin-bottom:10px;"><span class="live"></span>Live · refresh dans <span id="lvc">10s</span></div>`;
  if(sc.length>=3){
    const od=[sc[1],sc[0],sc[2]];const ht=[65,90,50];const cl=['#888780','#b45309','#854F0B'];const md=['🥈','🥇','🥉'];
    h+=`<div class="pdm">${od.map((s,i)=>`<div class="pc"><div class="pn" style="color:${cl[i]};font-weight:800;">${s.t}pts</div><div class="pn">${s.p.split(' ')[0]}</div><div class="pb" style="height:${ht[i]}px;background:${cl[i]}22;border:2px solid ${cl[i]}44;">${md[i]}</div></div>`).join('')}</div>`;
  }
  const med=['🥇','🥈','🥉'];
  h+=`<div class="rc" id="class-c">${sc.map((s,i)=>{
    const pv=DB.prevRanks[s.p];
    const arr=pv===undefined?'':pv>i?'<span style="color:var(--green);font-size:11px;">▲</span>':pv<i?'<span style="color:var(--red);font-size:11px;">▼</span>':'<span style="color:var(--text3);font-size:10px;">—</span>';
    return`<div class="rr ${ME===s.p?'me':''}">
      <div style="font-size:18px;width:30px;text-align:center;">${i<3?med[i]:`<span style="font-size:12px;color:var(--text3);font-weight:700;">${i+1}</span>`}</div>
      <div style="width:14px;">${arr}</div>
      <div class="av">${ini(s.p)}</div>
      <div style="flex:1;font-size:14px;font-weight:600;">${s.p}${ME===s.p?' <span class="bdg bg" style="font-size:10px;">Moi</span>':''}</div>
      <div style="text-align:right;"><div style="font-size:18px;font-weight:800;color:var(--green);">${s.t}</div><div style="font-size:10px;color:var(--text3);">${s.e}✓ ${s.b}~</div></div>
    </div>`;
  }).join('')}</div>`;
  return h;
}

      <button class="tb ${atab==='z'?'on':''}" onclick="setATab('z')">🔄 Reset</button>
    </div>
    <div id="at-p" class="tp ${atab==='p'?'on':''}">${buildAP()}</div>
    <div id="at-pr" class="tp ${atab==='pr'?'on':''}">${buildAPR()}</div>
    <div id="at-r" class="tp ${atab==='r'?'on':''}">${buildAR()}</div>
    <div id="at-c" class="tp ${atab==='c'?'on':''}">${buildAC()}</div>
    <div id="at-z" class="tp ${atab==='z'?'on':''}">${buildAZ()}</div>
  </div>`);
}
function setATab(t){atab=t;['p','pr','r','c','z'].forEach((x,i)=>{document.querySelectorAll('.tb')[i].classList.toggle('on',x===t);document.getElementById('at-'+x).classList.toggle('on',x===t);});if(t==='pr')document.getElementById('at-pr').innerHTML=buildAPR();if(t==='c')document.getElementById('at-c').innerHTML=buildAC();}

function buildAP(){
  const pl=Object.keys(DB.users);
  let h=`<div style="font-size:15px;font-weight:800;margin-bottom:12px;">Participants (${pl.length})</div>`;
  if(!pl.length)return h+`<div style="text-align:center;padding:30px;color:var(--text3);">Aucun participant inscrit</div>`;
  pl.forEach(p=>{const done=Object.keys(DB.pronos[p]||{}).length,tot=allM().length;h+=`<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:10px;"><div class="av">${ini(p)}</div><div><div style="font-size:14px;font-weight:600;">${p}</div><div style="font-size:11px;color:var(--text3);">${done}/${tot} pronostics</div><div class="pg" style="width:100px;margin-top:4px;"><div class="pf" style="width:${tot?Math.round(done/tot*100):0}%;"></div></div></div></div><button class="btn btn-sm btn-d" onclick="delUser('${p.replace(/'/g,"\\'")}')">✕</button></div>`;});
  return h;
}
async function delUser(n){if(!confirm('Supprimer '+n+' ?'))return;delete DB.users[n];delete DB.pronos[n];await dbSave('users');await dbSave('pronos');document.getElementById('at-p').innerHTML=buildAP();}

function buildAPR(){
  const pl=Object.keys(DB.users);const ms=allM();
  if(!pl.length)return'<div style="text-align:center;padding:30px;color:var(--text3);">Aucun participant</div>';
  let h=`<div style="display:flex;gap:6px;margin-bottom:14px;"><button class="btn btn-sm ${APV==='match'?'btn-p':'btn-gray'}" onclick="setAPV('match')">Par match</button><button class="btn btn-sm ${APV==='joueur'?'btn-p':'btn-gray'}" onclick="setAPV('joueur')">Par joueur</button></div>`;
  if(APV==='match'){
    let lastDay='';
    ms.forEach(m=>{
      const dk=dayKey(m.k);
      if(dk!==lastDay){lastDay=dk;h+=`<div class="date-sep">📅 ${fmtDay(m.k)}</div>`;}
      const r=DB.results[m.id];const lk=lkd(m);
      const nb=pl.filter(p=>(DB.pronos[p]||{})[m.id]).length;
      h+=`<div class="card" style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:4px;">${flag(m.t1,true)}<span style="font-size:13px;font-weight:700;">${m.t1} vs ${m.t2}</span>${flag(m.t2,true)}<span style="font-size:11px;color:var(--text3);">${m.d}</span>${lk?'<span class="bdg bo" style="font-size:9px;">🔒</span>':''}</div><div style="display:flex;gap:4px;align-items:center;">${r?`<span class="bdg bg">${r.s1}–${r.s2}</span>`:''}<span style="font-size:11px;color:var(--text3);">${nb}/${pl.length}</span></div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;">${pl.map(p=>{const pr=(DB.pronos[p]||{})[m.id];const v=r?calcPts(pr,r):null;const bg=v===3?'#dcfce7':v===1?'#dbeafe':v===0?'#f3f4f6':'#fff7ed';const bc=v===3?'#86efac':v===1?'#93c5fd':v===0?'#e5e7eb':'#fdba74';return`<div style="background:${bg};border:1px solid ${bc};border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:11px;font-weight:600;max-width:75px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.split(' ')[0]} ${p.split(' ')[1]?p.split(' ')[1][0]+'.':''}</span><span style="font-size:13px;font-weight:800;">${pr?pr.s1+'–'+pr.s2:'<span style="color:#ef4444;font-size:11px;">—</span>'}</span></div>`;}).join('')}</div></div>`;
    });
  } else {
    pl.forEach(p=>{const mp=DB.pronos[p]||{};const done=Object.keys(mp).length,tot=ms.length,pct=tot?Math.round(done/tot*100):0;const played2=ms.filter(m=>DB.results[m.id]);let tpts=0;played2.forEach(m=>{const v=calcPts(mp[m.id],DB.results[m.id]);if(v!==null)tpts+=v;});
    h+=`<div class="card" style="margin-bottom:8px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:8px;"><div class="av">${ini(p)}</div><div><div style="font-size:14px;font-weight:700;">${p}</div><div style="font-size:11px;color:var(--text3);">${done}/${tot} pronos${played2.length?` · <strong style="color:var(--green);">${tpts}pts</strong>`:''}</div></div></div><span class="bdg ${done===tot?'bg':'bo'}">${pct}%</span></div><div class="pg"><div class="pf" style="width:${pct}%;"></div></div>
    <div style="margin-top:10px;max-height:180px;overflow-y:auto;">${ms.map(m=>{const pr=mp[m.id];const r=DB.results[m.id];const v=r?calcPts(pr,r):null;return`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f3f4f6;font-size:12px;"><div style="display:flex;align-items:center;gap:3px;">${flag(m.t1,true)}<span>${m.t1}</span><span style="color:var(--text3);">vs</span><span>${m.t2}</span>${flag(m.t2,true)}<span style="color:var(--text3);font-size:10px;">${m.d}</span>${r?`<span style="color:var(--text3);">(${r.s1}–${r.s2})</span>`:''}</div><div style="display:flex;gap:3px;align-items:center;">${pr?`<span style="font-weight:800;">${pr.s1}–${pr.s2}</span>${v===3?'<span class="bdg bg" style="font-size:9px;">+3</span>':v===1?'<span class="bdg bb" style="font-size:9px;">+1</span>':v===0?'<span class="bdg bgr" style="font-size:9px;">0</span>':''}`:'<span style="color:var(--red);font-weight:700;">—</span>'}</div></div>`;}).join('')}</div></div>`;});
  }
  return h;
}
function setAPV(v){APV=v;document.getElementById('at-pr').innerHTML=buildAPR();}

function buildAR(){
  const ms=allM();
  let h=`<div style="font-size:15px;font-weight:800;margin-bottom:12px;">Résultats officiels</div>
  <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#eff6ff,#f0fdf4);">
    <div style="font-size:13px;font-weight:700;margin-bottom:8px;">➕ Ajouter un match (éliminatoires)</div>
    <div class="fld"><label>Phase</label><select id="np"><option value="16èmes de finale">16èmes de finale</option><option value="8èmes de finale">8èmes de finale</option><option value="Quarts de finale">Quarts de finale</option><option value="Demi-finales">Demi-finales</option><option value="Petite finale">Petite finale</option><option value="Finale">Finale</option></select></div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:8px;"><input id="nt1" type="text" placeholder="Équipe 1" style="padding:10px;border:1.5px solid var(--border);border-radius:var(--rs);"/><span style="text-align:center;color:var(--text3);">vs</span><input id="nt2" type="text" placeholder="Équipe 2" style="padding:10px;border:1.5px solid var(--border);border-radius:var(--rs);"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
      <div><label style="font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:3px;">DATE AFFICHÉE</label><input id="nd" type="text" placeholder="ex. 29/06 21h" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--rs);"/></div>
      <div><label style="font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:3px;">COUP D'ENVOI (PARIS)</label><input id="nk" type="datetime-local" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--rs);"/></div>
    </div>
    <button class="btn btn-g" onclick="addM()">+ Ajouter le match</button>
  </div>`;
  let lastDay='';
  ms.forEach(m=>{
    const dk=dayKey(m.k);
    if(dk!==lastDay){lastDay=dk;h+=`<div class="date-sep">📅 ${fmtDay(m.k)}</div>`;}
    const r=DB.results[m.id];const lk=lkd(m);
    h+=`<div class="card" style="margin-bottom:8px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:4px;">${flag(m.t1,true)}<span style="font-size:13px;font-weight:700;">${m.t1} vs ${m.t2}</span>${flag(m.t2,true)}<span style="font-size:10px;color:var(--text3);">${m.d||''}</span>${lk?'<span class="bdg bo" style="font-size:9px;">🔒</span>':''}</div>
    <div style="display:flex;gap:4px;">${r?`<span class="bdg bg">${r.s1}–${r.s2} ✓</span>`:'<span style="font-size:11px;color:var(--text3);">À jouer</span>'}<button class="btn btn-sm btn-d" style="padding:3px 7px;font-size:11px;" onclick="delM('${m.id}')">✕</button></div></div>
    <div style="display:flex;align-items:center;gap:8px;">${flag(m.t1,true)}<input type="number" min="0" max="20" value="${r?r.s1:''}" placeholder="—" id="r1_${m.id}" style="width:50px;height:42px;text-align:center;font-size:18px;font-weight:800;border:2px solid var(--border);border-radius:var(--rs);"/><span style="color:var(--text3);font-size:16px;">–</span><input type="number" min="0" max="20" value="${r?r.s2:''}" placeholder="—" id="r2_${m.id}" style="width:50px;height:42px;text-align:center;font-size:18px;font-weight:800;border:2px solid var(--border);border-radius:var(--rs);"/>${flag(m.t2,true)}<button class="btn btn-sm btn-g" style="flex:1;" onclick="saveR('${m.id}')">✓ OK</button>${r?`<button class="btn btn-sm btn-d" style="padding:6px 9px;" onclick="delR('${m.id}')">✕</button>`:''}</div></div>`;
  });
  return h;
}
async function addM(){
  const t1=document.getElementById('nt1').value.trim(),t2=document.getElementById('nt2').value.trim();
  const g=document.getElementById('np').value,d=document.getElementById('nd').value.trim(),kl=document.getElementById('nk').value;
  if(!t1||!t2)return;
  let k=null;if(kl){const dt=new Date(kl);k=new Date(dt.getTime()-2*3600000).toISOString();}
  if(!DB.extraMatchs)DB.extraMatchs=[];
  DB.extraMatchs.push({id:'X'+Date.now(),t1,t2,g,d,k});
  await dbSave('extraMatchs');
  document.getElementById('nt1').value='';document.getElementById('nt2').value='';document.getElementById('nd').value='';document.getElementById('nk').value='';
  document.getElementById('at-r').innerHTML=buildAR();
}
async function delM(id){if(!confirm('Supprimer ce match ?'))return;DB.extraMatchs=(DB.extraMatchs||[]).filter(m=>m.id!==id);for(const p in DB.pronos)if(DB.pronos[p])delete DB.pronos[p][id];delete DB.results[id];await dbSave('extraMatchs');await dbSave('pronos');await dbSave('results');document.getElementById('at-r').innerHTML=buildAR();}
async function saveR(mid){const s1=parseInt(document.getElementById('r1_'+mid).value),s2=parseInt(document.getElementById('r2_'+mid).value);if(isNaN(s1)||isNaN(s2))return;const prev=calcScores();prev.forEach((s,i)=>{DB.prevRanks[s.p]=i;});DB.results[mid]={s1,s2};await dbSave('results');await dbSave('prevRanks');document.getElementById('at-r').innerHTML=buildAR();}
async function delR(mid){delete DB.results[mid];await dbSave('results');document.getElementById('at-r').innerHTML=buildAR();}

function buildAC(){
  const sc=calcScores();let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-size:15px;font-weight:800;">Classement (${sc.length})</div><button class="btn btn-sm btn-gray" onclick="exportCSV()">📥 CSV</button></div>`;
  if(!sc.length)return h+'<div style="text-align:center;padding:20px;color:var(--text3);">Aucun participant</div>';
  const played2=allM().filter(m=>DB.results[m.id]);if(!played2.length)return h+'<div style="text-align:center;padding:20px;color:var(--text3);">En attente des résultats</div>';
  const med=['🥇','🥈','🥉'];
  h+=`<div class="rc">${sc.map((s,i)=>`<div class="rr"><div style="font-size:18px;width:30px;text-align:center;">${i<3?med[i]:`<span style="font-size:12px;color:var(--text3);">${i+1}</span>`}</div><div class="av">${ini(s.p)}</div><div style="flex:1;font-size:14px;font-weight:600;">${s.p}</div><div style="text-align:right;"><div style="font-size:18px;font-weight:800;color:var(--green);">${s.t}</div><div style="font-size:10px;color:var(--text3);">${s.e}✓ ${s.b}~</div></div></div>`).join('')}</div>`;
  return h;
}
function exportCSV(){const sc=calcScores();let c='Rang,Nom,Points,Exacts,Bons\n';sc.forEach((s,i)=>{c+=`${i+1},"${s.p}",${s.t},${s.e},${s.b}\n`;});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+c],{type:'text/csv'}));a.download='classement_wc2026.csv';a.click();}

function buildAZ(){return`<div style="font-size:15px;font-weight:800;margin-bottom:12px;">🔄 Réinitialisation</div>
  <div style="background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--r);padding:16px;margin-bottom:12px;"><div style="font-size:14px;font-weight:800;color:var(--red);margin-bottom:6px;">🗑️ Supprimer les données de test</div><div style="font-size:13px;color:var(--text2);margin-bottom:12px;">Efface participants, pronostics et résultats. Les matchs de base sont conservés.</div><button class="btn btn-d" onclick="resetAll()">Tout effacer (sauf matchs de base)</button></div>
  <div style="background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--r);padding:16px;"><div style="font-size:14px;font-weight:800;color:var(--red);margin-bottom:6px;">🔄 Réinitialisation complète</div><div style="font-size:13px;color:var(--text2);margin-bottom:12px;">Efface tout y compris les matchs ajoutés manuellement.</div><button class="btn btn-d" onclick="resetFull()">Réinitialisation complète</button></div>`;}
async function resetAll(){if(!confirm('⚠️ Effacer tous les participants, pronostics et résultats ?\n\nIrréversible !'))return;DB.users={};DB.pronos={};DB.results={};DB.prevRanks={};await Promise.all(['users','pronos','results','prevRanks'].map(k=>dbSave(k)));sessClear();alert('✅ Réinitialisation effectuée !');showAdmin();}
async function resetFull(){if(!confirm('⚠️ RÉINITIALISATION COMPLÈTE\n\nTout sera effacé.\n\nIrréversible !'))return;DB.users={};DB.pronos={};DB.results={};DB.prevRanks={};DB.extraMatchs=[];await Promise.all(['users','pronos','results','prevRanks','extraMatchs'].map(k=>dbSave(k)));sessClear();alert('✅ Réinitialisation complète !');showAdmin();}

(async()=>{await dbLoad();const s=sessGet();if(s&&DB.users[s]){ME=s;showPlayer();}else showLogin();})();
</script>
</body>
</html>
